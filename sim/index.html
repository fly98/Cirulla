<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulatore Duo</title>
<style>
  :root {
    --bg: #eceff3;
    --panel: #ffffff;
    --fg: #1b2330;
    --muted: #5d6877;
    --line: #cdd4de;
    --accent: #1f5fd6;
    --accent-fg: #ffffff;
    --bezel: #11151c;
    --screen: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d;
      --panel: #1a2029;
      --fg: #e6eaf0;
      --muted: #97a2b2;
      --line: #2b3441;
      --accent: #5b92ff;
      --accent-fg: #0c1220;
      --bezel: #05070a;
      --screen: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }
  .bar {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=url], input[type=number] {
    font: inherit;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    min-width: 0;
  }
  input[type=url] { flex: 1 1 260px; }
  input[type=number] { width: 78px; }
  button {
    font: inherit;
    color: var(--fg);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 12px;
    cursor: pointer;
  }
  button.on, button.go {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-fg);
    font-weight: 600;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .x { color: var(--muted); }
  .info { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    overflow: hidden;
  }
  .device {
    background: var(--bezel);
    border-radius: 26px;
    padding: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,.25);
    flex: none;
  }
  .clip { overflow: hidden; border-radius: 17px; background: var(--screen); }
  iframe {
    border: 0;
    display: block;
    background: var(--screen);
    transform-origin: 0 0;
  }
  .note { color: var(--muted); font-size: 12px; padding: 0 12px 10px; }
</style>
</head>
<body>
  <div class="bar">
    <form class="row" id="f">
      <input type="url" id="u" placeholder="https://fly98.github.io/..." inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Indirizzo della pagina">
      <button class="go" type="submit">Apri</button>
    </form>
    <div class="row" id="presets">
      <button type="button" data-w="626" data-h="890" id="p-in">Duo interno</button>
      <button type="button" data-w="466" data-h="678" id="p-out">Duo esterno</button>
      <button type="button" id="rot">Ruota</button>
      <span class="x">|</span>
      <input type="number" id="w" min="200" max="2000" aria-label="Larghezza in pixel"> <span class="x">×</span>
      <input type="number" id="h" min="200" max="2000" aria-label="Altezza in pixel">
    </div>
    <div class="info" id="info"></div>
  </div>
  <div class="stage" id="stage">
    <div class="device" id="dev">
      <div class="clip" id="clip"><iframe id="fr" title="Anteprima" referrerpolicy="no-referrer"></iframe></div>
    </div>
  </div>
  <div class="note">Misure in pixel CSS, valori dichiarati dalle prime analisi: da verificare con il simulatore Xcode. Non mostra barra di Safari, safe area né tastiera.</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var fr = $("fr"), clip = $("clip"), stage = $("stage");
  var W = 626, H = 890;

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function fit() {
    var pad = 10 * 2 + 14 * 2;
    var availW = stage.clientWidth - pad;
    var availH = stage.clientHeight - pad;
    var s = Math.min(1, availW / W, availH / H);
    if (!(s > 0)) s = 1;
    fr.style.width = W + "px";
    fr.style.height = H + "px";
    fr.style.transform = "scale(" + s + ")";
    clip.style.width = Math.round(W * s) + "px";
    clip.style.height = Math.round(H * s) + "px";
    $("w").value = W;
    $("h").value = H;
    $("info").textContent = W + " × " + H + " px CSS, scala " + Math.round(s * 100) + "%";
    $("p-in").classList.toggle("on", W === 626 && H === 890);
    $("p-out").classList.toggle("on", W === 466 && H === 678);
  }

  function setSize(w, h) {
    W = Math.max(200, Math.min(2000, Math.round(w)));
    H = Math.max(200, Math.min(2000, Math.round(h)));
    fit();
  }

  function normalize(v) {
    v = (v || "").trim();
    if (!v) return "";
    if (!/^https?:\/\//i.test(v)) v = "https://" + v;
    return v;
  }

  function go(v) {
    var url = normalize(v);
    if (!url) return;
    $("u").value = url;
    store("sim.url", url);
    fr.src = url;
  }

  $("f").addEventListener("submit", function (e) { e.preventDefault(); go($("u").value); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-w]"), function (b) {
    b.addEventListener("click", function () { setSize(+b.dataset.w, +b.dataset.h); });
  });
  $("rot").addEventListener("click", function () { setSize(H, W); });
  $("w").addEventListener("change", function () { setSize(+$("w").value || W, H); });
  $("h").addEventListener("change", function () { setSize(W, +$("h").value || H); });
  window.addEventListener("resize", fit);

  var q = new URLSearchParams(location.search).get("u");
  var start = q || load("sim.url") || "https://fly98.github.io/Cirulla/";
  fit();
  go(start);
})();
</script>
</body>
</html>
